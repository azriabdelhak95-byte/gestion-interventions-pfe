<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un nouveau mot de passe - AZ Engineering</title>
    <style>
        :root {
            --az-blue: #0056b3;
            --az-dark: #343a40;
            --az-light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--az-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid var(--az-blue);
        }
        h2 { text-align: center; color: var(--az-dark); }
        label { font-size: 14px; font-weight: bold; color: #555; }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--az-blue);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #004494; }
        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--az-blue);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Nouveau mot de passe</h2>
    
    <form id="resetForm">
        <label for="newPassword">Votre nouveau mot de passe :</label>
        <input type="password" id="newPassword" required placeholder="Tapez votre mot de passe">
        
        <button type="submit">Valider et se connecter</button>
    </form>

    <div id="message"></div>
    
    <a href="index.html" class="back-link" style="display:none;" id="loginLink">Aller à la page de connexion</a>
</div>

<script>
    // 1. Récupérer le "token" dans l'adresse URL de la page (envoyé par l'e-mail)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // Sécurité : si la personne arrive ici sans token, on bloque.
    if (!token) {
        document.getElementById('message').textContent = "Erreur : Lien invalide ou expiré.";
        document.getElementById('message').className = "error";
        document.getElementById('resetForm').style.display = "none";
    }

    // 2. Gérer l'envoi du formulaire
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById('newPassword').value;
        const messageDiv = document.getElementById('message');
        const submitBtn = document.querySelector('button');
        
        // On désactive le bouton pendant le chargement (bonne pratique UX !)
        submitBtn.disabled = true;
        messageDiv.textContent = "Modification en cours...";
        messageDiv.className = "";
        
        try {
            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, newPassword: newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                // Succès !
                messageDiv.textContent = "✅ " + data.message;
                messageDiv.className = "success";
                document.getElementById('resetForm').style.display = "none"; // Cache le formulaire
                document.getElementById('loginLink').style.display = "block"; // Affiche le lien de retour
            } else {
                // Erreur (token expiré, etc.) : CORRECTION ICI
                messageDiv.textContent = "❌ " + (data.error || data.message || "Une erreur est survenue.");
                messageDiv.className = "error";
                submitBtn.disabled = false;
            }
        } catch (error) {
            messageDiv.textContent = "❌ Erreur de connexion au serveur.";
            messageDiv.className = "error";
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
