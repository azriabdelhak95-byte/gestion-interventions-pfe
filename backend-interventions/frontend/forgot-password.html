<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - AZ Engineering</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 5px solid #0056b3; }
        h2 { color: #343a40; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        label { font-size: 14px; color: #555; font-weight: bold; }
        input[type="email"] { width: 100%; padding: 10px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #004494; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>AZ Engineering</h2>
    <p class="subtitle">Récupération d'accès</p>
    
    <form id="forgotPasswordForm">
        <label for="email">Adresse e-mail du compte :</label>
        <input type="email" id="email" required placeholder="Tapez l'adresse e-mail">
        <button type="submit">Envoyer le lien de secours</button>
    </form>

    <div id="message"></div>
</div>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        const email = document.getElementById('email').value;
        const messageDiv = document.getElementById('message');
        const submitBtn = document.querySelector('button');
        
        messageDiv.textContent = "Envoi en cours...";
        messageDiv.className = "";
        submitBtn.disabled = true;

        try {
            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await response.json();
            
            if (response.ok) {
                messageDiv.textContent = "✅ " + data.message;
                messageDiv.className = "success";
            } else {
                // Le message d'erreur est géré proprement ici
                messageDiv.textContent = "❌ " + (data.error || data.message || "Une erreur est survenue.");
                messageDiv.className = "error";
            }
        } catch (error) {
            messageDiv.textContent = "❌ Erreur de connexion au serveur.";
            messageDiv.className = "error";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
